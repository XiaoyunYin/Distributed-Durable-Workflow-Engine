apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-demand
  namespace: dur053-kind
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
          - periodSeconds: 30
            type: Pods
            value: 1
          selectPolicy: Min
          stabilizationWindowSeconds: 60
        scaleUp:
          policies:
          - periodSeconds: 30
            type: Pods
            value: 1
          selectPolicy: Min
          stabilizationWindowSeconds: 0
  cooldownPeriod: 60
  fallback:
    failureThreshold: 3
    replicas: 2
  maxReplicaCount: 4
  minReplicaCount: 1
  pollingInterval: 5
  scaleTargetRef:
    name: worker
  triggers:
  - authenticationRef:
      name: campaign-demand
    metadata:
      authMode: bearer
      format: json
      targetValue: "2"
      unsafeSsl: "false"
      url: http://demand.dur053-kind.svc.cluster.local:8091/v1/demand
      valueLocation: demand
    metricType: AverageValue
    type: metrics-api
