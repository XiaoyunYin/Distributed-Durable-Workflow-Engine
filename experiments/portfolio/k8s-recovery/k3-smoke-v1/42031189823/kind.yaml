apiVersion: batch/v1
kind: Job
metadata:
  name: compatibility
  namespace: dur053-kind
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: compatibility
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /runtime
        - compatibility-check
        - --worker-registry
        - /registry/worker.json
        env:
        - name: RUNTIME_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: campaign-db
        - name: DUR048_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        - name: DUR053_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        - name: DUR049_RECORD_LEASE_ACQUISITIONS
          value: "1"
        image: localhost:5001/dur053-runtime@sha256:5adbe7113373deb8ed4d075f931d64e96814f541a4910565f526e01c6934dfc2
        imagePullPolicy: Never
        name: compatibility
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /registry
          name: registry
          readOnly: true
      initContainers:
      - command:
        - python
        - -c
        - import json; from workers.registry import default_registry; open("/registry/worker.json","w").write(json.dumps(default_registry().manifest()))
        env:
        - name: DUR048_ACTIVITY_DELAY_MS
          value: "100"
        - name: DUR053_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        image: localhost:5001/dur053-worker@sha256:3245139923920711af2d6c9cefdd4ef947a5c673ded4e51b902ad62162b4edc6
        imagePullPolicy: Never
        name: candidate-worker-registry
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /registry
          name: registry
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: compatibility
      terminationGracePeriodSeconds: 40
      volumes:
      - emptyDir: {}
        name: registry
