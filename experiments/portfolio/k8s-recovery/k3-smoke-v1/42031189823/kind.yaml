---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dur053-kind
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: RUNTIME_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: campaign-db
        - name: DUR048_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        - name: DUR053_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        - name: DUR049_RECORD_LEASE_ACQUISITIONS
          value: "1"
        - name: RUNTIME_ROLES
          value: api
        - name: RUNTIME_ROLE
          value: api
        - name: RUNTIME_ADDR
          value: 0.0.0.0:8080
        - name: RUNTIME_DB_MAX_CONNS
          value: "4"
        - name: RUNTIME_TOKEN_AUTH
          value: enabled
        - name: RUNTIME_TOKEN_REVIEW_URL
          value: https://kubernetes.default.svc
        - name: RUNTIME_TOKEN_REVIEW_CA
          value: /identity/ca.crt
        - name: RUNTIME_TOKEN_REVIEW_TOKEN_FILE
          value: /identity/reviewer
        - name: RUNTIME_TOKEN_ISSUER
          value: https://kubernetes.default.svc.cluster.local
        - name: RUNTIME_TOKEN_AUDIENCE
          value: durable-client
        - name: RUNTIME_TOKEN_SERVICE_ACCOUNT
          value: observer
        - name: RUNTIME_TOKEN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: localhost:5001/dur053-runtime@sha256:5adbe7113373deb8ed4d075f931d64e96814f541a4910565f526e01c6934dfc2
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 2
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
        name: api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: scratch
        - mountPath: /identity
          name: identity
          readOnly: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: api
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir: {}
        name: scratch
      - name: identity
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: https://kubernetes.default.svc.cluster.local
              expirationSeconds: 3600
              path: reviewer
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
---
