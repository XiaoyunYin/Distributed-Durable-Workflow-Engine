apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer
  namespace: dur053-kind
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: observer
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: observer
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -c
        - import time; time.sleep(86400)
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: DUR048_ACTIVITY_DELAY_MS
          value: "100"
        - name: DUR053_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        - name: WORKER_SLOTS
          value: "2"
        - name: WORKER_DRAIN_SECONDS
          value: "30"
        - name: CONTROL_API_URL
          value: http://worker-control:8080
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: ""
        - name: WORKER_TOKEN_FILE
          value: /identity/token
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: campaign-db
        - name: DUR048_ALLOW_FIXTURE_ACTIVITY
          value: "1"
        image: localhost:5001/dur053-worker@sha256:3245139923920711af2d6c9cefdd4ef947a5c673ded4e51b902ad62162b4edc6
        imagePullPolicy: Never
        name: observer
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: scratch
        - mountPath: /identity
          name: identity
          readOnly: true
        - mountPath: /evidence
          name: evidence
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: observer
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: observer
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir: {}
        name: scratch
      - name: identity
        projected:
          sources:
          - serviceAccountToken:
              audience: durable-client
              expirationSeconds: 3600
              path: token
          - serviceAccountToken:
              audience: durable-operator
              expirationSeconds: 3600
              path: operator
      - emptyDir: {}
        name: evidence
