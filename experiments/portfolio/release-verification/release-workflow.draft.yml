# J8 slice 0. Keep outside .github/workflows. No job can run in this draft.
# Claude reviews internal CI. The three outward stages verify the same
# Claude-recorded owner grant. The optional dispatch input identifies the record.
name: J8 verifiable release (draft)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed protected-branch commit
        type: string
        required: true
      tag:
        description: Exact unused release version under review
        type: string
        required: true
      authorization_record:
        description: Identifier of the single Claude-recorded release grant
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: j8-release
  cancel-in-progress: false

env:
  GOFLAGS: '-p=1'
  GOMAXPROCS: '2'

jobs:
  admission:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
    steps:
      - name: Require Claude-reviewed candidate, trusted workflow and runner admission
        id: gate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: exit 1

  build_scan:
    needs: admission
    if: ${{ false && needs.admission.outputs.admitted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: j8-candidate-artifacts
    steps:
      - name: Seal clean OCI builds, helper assets, SBOMs and pre-push scan verdicts
        run: exit 1
      - name: Stage the sealed candidate in per-run Actions artifacts under Claude review
        run: exit 1

  registry:
    needs: [admission, build_scan]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: j8-ghcr
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify the single grant against actual OCI digests, GHCR destinations and dispositions
        id: registry_grant
        env:
          AUTHORIZATION_RECORD: ${{ inputs.authorization_record }}
        run: exit 1
      - name: Push the two authorized image digests to GHCR
        if: ${{ steps.registry_grant.outputs.authorized == 'true' }}
        run: exit 1

  provenance:
    needs: [admission, build_scan, registry]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: j8-provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Verify the Claude-reviewed same-run digest binding
        run: exit 1
      - name: Write provenance to the GitHub attestation store
        run: exit 1

  digest_contract:
    needs: [admission, build_scan, registry, provenance]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recheck pulled digests and scan policy, attestations and seeded HTTP contract controls
        run: exit 1

  cold_quickstart:
    needs: [admission, build_scan, registry, provenance]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - name: Cold release quickstart repeat ${{ matrix.repeat }}
        run: exit 1
      - name: Label Compose-only TokenReview fixture in quickstart artifacts
        run: exit 1

  replay_before_release:
    needs: [admission, build_scan]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify sealed replay asset and both offline verdicts
        run: exit 1

  tag:
    needs: [admission, digest_contract, cold_quickstart, replay_before_release]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: j8-tag
    permissions:
      contents: write
    outputs:
      tag_object: ${{ steps.push_tag.outputs.tag_object }}
    steps:
      - name: Create the Claude-reviewed annotated tag locally and seal the object SHA
        run: exit 1
      - name: Verify the single grant against the actual tag object and unused remote ref
        id: tag_push_grant
        env:
          AUTHORIZATION_RECORD: ${{ inputs.authorization_record }}
        run: exit 1
      - name: Push the authorized tag object
        id: push_tag
        if: ${{ steps.tag_push_grant.outputs.authorized == 'true' }}
        run: exit 1

  release_draft:
    needs: [admission, tag]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: j8-release-draft
    permissions:
      contents: write
    outputs:
      draft_id: ${{ steps.create_draft.outputs.draft_id }}
    steps:
      - name: Check the Claude-reviewed existing tag object and peeled candidate
        env:
          TAG_OBJECT: ${{ needs.tag.outputs.tag_object }}
        run: exit 1
      - name: Create an unpublished draft and seal the same-run draft ID receipt
        id: create_draft
        run: exit 1

  release_assets:
    needs: [admission, build_scan, release_draft]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: j8-release-assets
    permissions:
      contents: write
    steps:
      - name: Check the draft is unpublished and verify the Claude-reviewed asset inventory
        env:
          DRAFT_ID: ${{ needs.release_draft.outputs.draft_id }}
        run: exit 1
      - name: Stage checked assets on the unpublished draft
        run: exit 1

  release_publish:
    needs: [admission, tag, release_draft, release_assets]
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: j8-release-publish
    permissions:
      contents: write
    steps:
      - name: Verify the single grant against the actual draft ID, tag and attached asset inventory
        id: publish_grant
        env:
          AUTHORIZATION_RECORD: ${{ inputs.authorization_record }}
          DRAFT_ID: ${{ needs.release_draft.outputs.draft_id }}
          TAG_OBJECT: ${{ needs.tag.outputs.tag_object }}
        run: exit 1
      - name: Publish the authorized GitHub release draft
        if: ${{ steps.publish_grant.outputs.authorized == 'true' }}
        run: exit 1

  public_readback:
    needs: release_publish
    if: ${{ false && success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fetch public assets anonymously and repeat both replay verdicts offline
        run: exit 1
      - name: Upload scrubbed readback evidence to per-run Actions artifacts under Claude review
        run: exit 1
