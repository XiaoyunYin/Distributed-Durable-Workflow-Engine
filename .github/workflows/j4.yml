name: J4 recorded-provider recovery
on:
  pull_request:
    paths:
      - '.github/workflows/j4.yml'
      - 'cmd/runtime/**'
      - 'deploy/j4/**'
      - 'deploy/runtime-switches.json'
      - 'internal/api/**'
      - 'internal/engine/**'
      - 'internal/state/**'
      - 'internal/invariants/k6v1/**'
      - 'migrations/**'
      - 'python/workers/**'
      - 'tests/test_j4_*.py'
  workflow_dispatch:
    inputs:
      mode:
        description: J4 job mode
        type: choice
        options: [tooling, qualification, measurement]
        default: tooling
        required: true
      relay_switch:
        description: Registered J9a repaired-relay environment key
        type: string
      relay_value:
        description: Registered J9a repaired-relay opt-in value
        type: string
      qualification_run:
        description: Successful exact-head qualification run ID (measurement)
        type: string
      qualification_attempt:
        description: Qualification run attempt (measurement)
        type: string
      qualification_digest:
        description: Reviewed qualification artifact SHA-256, without prefix (measurement)
        type: string
      reviewed_head:
        description: Full reviewed qualification source revision (measurement)
        type: string
      review_round:
        description: Review round accepting this qualification and its sealed inputs (measurement)
        type: string
permissions:
  contents: read
  actions: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: 'python:scripts'
jobs:
  tooling:
    if: github.event_name == 'pull_request' || inputs.mode == 'tooling'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Build and verify J4 tooling and legacy equivalence
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          uv sync --locked
          go build -p 1 ./...
          go run ./cmd/dur053-migrate
        # Expose the disposable database only to the migration command.
        # The checker/legacy suite remains a separate job from the K6 fixtures.
      - name: Run J4 PostgreSQL, configuration and offline replay checks
        shell: bash
        env:
          J4_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          go test -race ./cmd/runtime ./internal/api ./internal/state -run 'J4|RecordedLLM|RecordedProvider'
          go test -race ./internal/invariants/k6v1
          uv run --locked pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/j4-pytest" tests/test_j4_*.py
          uv run --locked python scripts/check-activity-registry.py
          J4_RECORDED_LLM_ACTIVITY=1 uv run --locked python scripts/check-activity-registry.py
          J4_RECORDED_LLM_ACTIVITY=1 J4_PROVIDER_RESILIENCE=1 uv run --locked python scripts/check-activity-registry.py
          uv run --locked python -m deploy.j4.campaign forecast
          uv run --locked ruff check deploy/j4 tests/test_j4_*.py
  hosted:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'qualification' || inputs.mode == 'measurement')
    name: J4 ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: j4-recorded-provider-hosted
      cancel-in-progress: false
    steps:
      - name: Record start of J4 bootstrap
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          date +J4_JOB_STARTED=%s >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/j4-evidence"
          printf '{"mode":"%s","run_id":"%s","run_attempt":"%s","source_revision":"%s","phase":"bootstrap"}\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/j4-evidence/bootstrap.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Admit exact inputs and run registered J4 cells
        id: campaign
        shell: bash
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RELAY_SWITCH: ${{ inputs.relay_switch }}
          RELAY_VALUE: ${{ inputs.relay_value }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
          QUALIFICATION_DIGEST: ${{ inputs.qualification_digest }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEW_ROUND: ${{ inputs.review_round }}
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked python - <<'PY'
          import json
          import pathlib
          import shutil
          import subprocess
          import sys
          import urllib.request
          import hashlib

          pin = json.loads(pathlib.Path("deploy/k8s/tools.lock.json").read_bytes())["pyyaml"]
          with urllib.request.urlopen(pin["url"], timeout=30) as response:
              wheel = pathlib.Path("/tmp") / pin["url"].rsplit("/", 1)[-1]
              with wheel.open("wb") as target:
                  shutil.copyfileobj(response, target)
          if hashlib.sha256(wheel.read_bytes()).hexdigest() != pin["sha256"]:
              sys.exit("J4 PyYAML lock mismatch")
          subprocess.run(["uv", "pip", "install", "--python", sys.executable, "--no-deps", str(wheel)], check=True)
          wheel.unlink()
          PY
          .venv/bin/python -m deploy.j4.campaign "$MODE" \
            --output "$RUNNER_TEMP/j4-evidence" --scratch "$RUNNER_TEMP/j4-scratch" \
            --job-started "$J4_JOB_STARTED" --relay-switch "$RELAY_SWITCH" --relay-value "$RELAY_VALUE" \
            --qualification-run "$QUALIFICATION_RUN" --qualification-attempt "$QUALIFICATION_ATTEMPT" \
            --qualification-digest "$QUALIFICATION_DIGEST" --reviewed-head "$REVIEWED_HEAD" \
            --review-round "$REVIEW_ROUND"
      - name: Retain complete or partial J4 evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j4-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j4-evidence/
          if-no-files-found: error
          compression-level: 0
      - name: Record the published evidence identity
        if: always() && steps.evidence.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'J4 evidence %s (%s) %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify reconciliation, teardown and upload met the closeout allowance
        if: always() && steps.campaign.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "j4-evidence" / "campaign.json"
          report = json.loads(evidence.read_bytes())
          if not 0 <= time.time() - report["closeout_started_unix"] <= 25 * 60:
              raise SystemExit("J4 exceeded the registered closeout allowance")
          PY
