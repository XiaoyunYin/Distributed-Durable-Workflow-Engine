name: J2 volume qualification attempt

on:
  workflow_call:
    inputs:
      population:
        required: true
        type: number
    outputs:
      artifact_id:
        value: ${{ jobs.attempt.outputs.artifact_id }}
      verdict:
        value: ${{ jobs.attempt.outputs.verdict }}

permissions:
  contents: read
  actions: read

jobs:
  attempt:
    name: J2 unmeasured volume (${{ inputs.population }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      verdict: ${{ steps.closeout.outputs.verdict || 'invalid' }}
    env:
      J2_VOLUME: ${{ inputs.population }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore the retained images
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/j2-volume-evidence"
          set -o pipefail
          bash scripts/j2_restore_images.sh 2>&1 | tee "$RUNNER_TEMP/j2-volume-evidence/image-restore.log"
      - name: Qualify the rebuilt registered profile
        id: qualify
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/j2_qualify_volume.py "$J2_VOLUME" "$RUNNER_TEMP/j2-volume-evidence" \
            "$RUNNER_TEMP/j2-volume-scratch" "$RUNNER_TEMP/j2-images-layouts" "$RUNNER_TEMP/j2-exporter-layouts"
      - name: Retain frozen evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-volume-${{ inputs.population }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-volume-evidence/
          if-no-files-found: error
          compression-level: 1
      - name: Classify the frozen evidence and verify closeout
        if: always()
        id: closeout
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          QUALIFICATION: ${{ steps.qualify.outcome }}
        run: |
          python3 scripts/j2_qualification_evidence.py closeout "$RUNNER_TEMP/j2-volume-evidence"
