name: J2 load-envelope tooling

on:
  push:
    branches: [codex/j2-slice1]
    paths:
      - '.github/workflows/j2-load-envelope.yml'
      - 'scripts/j2_build_images.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j2-load-envelope-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  image-pair:
    name: J2 registered image reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 752711cd164c30dbb6da54d4a866f6979998e1b4
          path: k3-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: j2-source
          persist-credentials: false
      - name: Build and retain the registered pair
        run: bash j2-source/scripts/j2_build_images.sh k3-source "$RUNNER_TEMP/j2-images"
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-images/
          compression-level: 0
          if-no-files-found: error
