name: J2 load-envelope tooling

on:
  pull_request:
    paths:
      - '.github/workflows/j2-load-envelope.yml'
      - '.github/workflows/j2-volume-qualification.yml'
      - '.github/actions/j2-barrier-round/**'
      - 'experiments/portfolio/load-envelope/**'
      - 'scripts/j2_*'
      - 'cmd/j2-sender/**'
      - 'internal/dur053/**'
      - 'mutations/j2-manifest.json'
      - 'deploy/k8s/connection-budget.json'
      - 'deploy/k8s/tools.lock.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      mode:
        description: Unmeasured engineering job
        type: choice
        options:
          - overlay
          - checker-prequalification
          - qualification
          - harness-reset
          - harness-schedule
          - harness-sender
          - harness-step
          - barrier-success
          - barrier-peer-failure
          - barrier-missing-peer
        default: overlay
      compare_gomemlimit:
        description: Compare unset, 1100MiB and 1200MiB on this revision in pre-qualification
        type: boolean
        default: false
      engineering_hold_rate:
        description: >-
          Harness-step hold arrivals/s. Rates 4 and 8 are non-grid retries for a valid no-carry
          result. Rate 8 is sized for natural carry-in under even spacing.
        type: choice
        options: ['1', '4', '8']
        default: '1'

permissions:
  contents: read
  actions: read

concurrency:
  group: j2-load-envelope-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'pr' }}
  cancel-in-progress: false

jobs:
  tooling:
    if: github.event_name == 'pull_request' || inputs.mode == 'overlay'
    name: ${{ github.event_name == 'pull_request' && 'J2 tooling smoke' || 'J2 unmeasured overlay pilot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 35 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        if: github.event_name == 'pull_request'
        with:
          go-version: '1.27.4'
      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'pull_request'
        with:
          version: '0.9.5'
      - name: Offline and exporter unit tests and decision mutations
        if: github.event_name == 'pull_request'
        env:
          GOMAXPROCS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          go test -p 1 ./experiments/portfolio/load-envelope/exporter
          uv run --locked --only-group dev pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/j2-pytest" experiments/portfolio/load-envelope/test_j2_*.py
      - name: Restore the retained images
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/j2_restore_images.sh
      - name: Verify the overlay on a disposable cluster
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/j2_verify_overlay.py "$RUNNER_TEMP/j2-overlay-evidence" \
            "$RUNNER_TEMP/j2-overlay-scratch" "$RUNNER_TEMP/j2-images-layouts" "$RUNNER_TEMP/j2-exporter-layouts"
      - name: Retain overlay evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-overlay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-overlay-evidence/
          if-no-files-found: warn

  barrier:
    if: >-
      github.event_name == 'workflow_dispatch' && !github.event.repository.private
      && (inputs.mode == 'barrier-success' || inputs.mode == 'barrier-peer-failure'
          || inputs.mode == 'barrier-missing-peer')
    name: J2 barrier job-${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        job: [1, 2, 3]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rehearse the eligible decision
        if: inputs.mode == 'barrier-success'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: eligible
          job: ${{ matrix.job }}
      - name: Rehearse no eligible rate
        if: inputs.mode == 'barrier-success'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: no-eligible
          job: ${{ matrix.job }}
      - name: Rehearse an integrity stop
        if: inputs.mode == 'barrier-success'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: integrity
          job: ${{ matrix.job }}
      - name: Rehearse a corrupted manifest
        if: inputs.mode == 'barrier-success'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: corrupted
          job: ${{ matrix.job }}
      - name: Rehearse a mixed-attempt manifest
        if: inputs.mode == 'barrier-success'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: mixed
          job: ${{ matrix.job }}
      - name: Rehearse peer failure after publication
        if: inputs.mode == 'barrier-peer-failure'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: peer-failure
          job: ${{ matrix.job }}
      - name: Rehearse the actual missing-peer deadline
        if: inputs.mode == 'barrier-missing-peer'
        uses: ./.github/actions/j2-barrier-round
        with:
          scenario: missing-peer
          job: ${{ matrix.job }}
      - name: Preserve partial barrier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-barrier-partial-${{ github.run_id }}-${{ github.run_attempt }}-job-${{ matrix.job }}
          path: ${{ runner.temp }}/j2-barrier/
          if-no-files-found: warn
          retention-days: 90

  barrier-report:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && !github.event.repository.private
      && (inputs.mode == 'barrier-success' || inputs.mode == 'barrier-peer-failure'
          || inputs.mode == 'barrier-missing-peer')
    needs: [barrier]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify immutable barrier decisions and fixture outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCENARIO: ${{ inputs.mode }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/j2_barrier_rehearsal.py report "$RUNNER_TEMP/j2-barrier-report" "$SCENARIO"
      - name: Retain the independently verified report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-barrier-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-barrier-report/
          if-no-files-found: warn
          retention-days: 90

  harness-reset:
    if: >-
      github.event_name == 'workflow_dispatch' && !github.event.repository.private
      && (inputs.mode == 'harness-reset' || inputs.mode == 'harness-schedule'
          || inputs.mode == 'harness-sender' || inputs.mode == 'harness-step')
    name: J2 unmeasured ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'harness-step' && 110 || 60 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      J2_HARNESS_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.mode == 'harness-step' && '0' || '1' }}
      - name: Restore the retained images
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/j2-harness-evidence"
          bash scripts/j2_restore_images.sh 2>&1 | tee "$RUNNER_TEMP/j2-harness-evidence/image-restore.log"
      - uses: actions/setup-go@v5
        if: inputs.mode != 'harness-reset'
        with:
          go-version: '1.27.4'
      - name: Build and record the stock K4 sender
        if: inputs.mode == 'harness-schedule'
        timeout-minutes: 6
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/j2-harness-evidence"
          python3 scripts/j2_build_sender.py "$GITHUB_SHA" "$RUNNER_TEMP/j2-sender/stock-loadgen" \
            "$evidence/sender-build.json" 2>&1 | tee "$evidence/sender-build.log"
      - name: Build and record the two-period J2 sender
        if: inputs.mode == 'harness-sender'
        timeout-minutes: 6
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/j2-harness-evidence"
          python3 scripts/j2_build_sender.py "$GITHUB_SHA" "$RUNNER_TEMP/j2-sender/continuous" \
            "$evidence/sender-build.json" --package ./cmd/j2-sender \
            2>&1 | tee "$evidence/sender-build.log"
      - name: Build the two pinned senders and reproduce the locked checker
        if: inputs.mode == 'harness-step'
        timeout-minutes: 8
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/j2-harness-evidence"
          binaries="$RUNNER_TEMP/j2-sender"
          {
            python3 scripts/j2_build_sender.py "$GITHUB_SHA" "$binaries/stock" "$evidence/stock-build.json"
            python3 scripts/j2_build_sender.py "$GITHUB_SHA" "$binaries/continuous" \
              "$evidence/continuous-build.json" --package ./cmd/j2-sender
            python3 scripts/j2_checker.py "$binaries/checker"
          } 2>&1 | tee "$evidence/step-build.log"
      - name: Rehearse fresh state and an interrupted submission
        if: inputs.mode == 'harness-reset'
        timeout-minutes: 42
        run: |
          python3 scripts/j2_harness.py "$RUNNER_TEMP/j2-harness-evidence" \
            "$RUNNER_TEMP/j2-harness-scratch" "$RUNNER_TEMP/j2-images-layouts" \
            "$RUNNER_TEMP/j2-exporter-layouts"
      - name: Rehearse the stock K4 schedule and interruption
        if: inputs.mode == 'harness-schedule'
        timeout-minutes: 42
        run: |
          python3 scripts/j2_schedule_rehearsal.py "$RUNNER_TEMP/j2-harness-evidence" \
            "$RUNNER_TEMP/j2-harness-scratch" "$RUNNER_TEMP/j2-images-layouts" \
            "$RUNNER_TEMP/j2-exporter-layouts" "$RUNNER_TEMP/j2-sender/stock-loadgen"
      - name: Rehearse the two-period J2 sender and interruption
        if: inputs.mode == 'harness-sender'
        timeout-minutes: 42
        run: |
          python3 scripts/j2_schedule_rehearsal.py "$RUNNER_TEMP/j2-harness-evidence" \
            "$RUNNER_TEMP/j2-harness-scratch" "$RUNNER_TEMP/j2-images-layouts" \
            "$RUNNER_TEMP/j2-exporter-layouts" "$RUNNER_TEMP/j2-sender/continuous" \
            --continuous
      - name: Rehearse the full-clock step and both quiet drains
        if: inputs.mode == 'harness-step'
        timeout-minutes: 85
        env:
          J2_ENGINEERING_HOLD_RATE: ${{ inputs.engineering_hold_rate }}
        run: |
          binaries="$RUNNER_TEMP/j2-sender"
          python3 scripts/j2_step_rehearsal.py "$RUNNER_TEMP/j2-harness-evidence" \
            "$RUNNER_TEMP/j2-harness-scratch" "$RUNNER_TEMP/j2-images-layouts" \
            "$RUNNER_TEMP/j2-exporter-layouts" "$binaries/stock" \
            "$binaries/continuous" "$binaries/checker" --hold-rate "$J2_ENGINEERING_HOLD_RATE"
      - name: Seal harness evidence
        id: seal
        if: always()
        run: python3 scripts/j2_harness_evidence.py seal "$RUNNER_TEMP/j2-harness-evidence"
      - name: Retain the sealed attempt
        id: upload
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-harness-evidence/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
      - name: Retain unsealed evidence after a seal failure
        if: always() && (steps.seal.outcome != 'success' || steps.upload.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-${{ inputs.mode }}-unsealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-harness-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Verify the published ZIP and record expiry
        id: verify-archive
        if: always() && steps.upload.outcome == 'success'
        timeout-minutes: ${{ inputs.mode == 'harness-step' && 8 || 3 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          receipt="$RUNNER_TEMP/j2-harness-receipt"
          archive="$RUNNER_TEMP/j2-harness-attempt.zip"
          mkdir "$receipt"
          endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          gh api "$endpoint" > "$receipt/artifact.json"
          gh api "$endpoint/zip" > "$archive"
          python3 scripts/j2_harness_evidence.py verify-upload \
            "$archive" "$receipt/artifact.json" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" \
            --mode "$J2_HARNESS_MODE"
          if [[ "$J2_HARNESS_MODE" == harness-step ]]; then
            python3 scripts/j2_drain.py "$archive" "$receipt/offline-replay.json"
          fi
          {
            printf 'Verified J2 %s evidence [%s](%s)\n\n' "$J2_HARNESS_MODE" "$ARTIFACT_ID" "$ARTIFACT_URL"
            jq -r '"SHA-256 \(.digest) · expires \(.expires_at)"' "$receipt/artifact.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the artifact verification receipt
        if: always() && steps.verify-archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-${{ inputs.mode }}-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-harness-receipt/
          if-no-files-found: error
          retention-days: 90

  checker-prequalification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'checker-prequalification'
    name: J2 checker pre-qualification (${{ matrix.population }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        population: [21002, 26678]
    env:
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      POPULATION: ${{ matrix.population }}
      COMPARE_GOMEMLIMIT: ${{ inputs.compare_gomemlimit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Verify the checker lock and build the migrator
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/j2-prequalification"
          build_args=()
          if [[ "$COMPARE_GOMEMLIMIT" == true ]]; then
            build_args+=(--comparison-source "$GITHUB_SHA")
          fi
          python3 scripts/j2_checker.py "$RUNNER_TEMP/j2-tooling/checker" "${build_args[@]}" 2>&1 | tee "$RUNNER_TEMP/j2-prequalification/checker-build.log"
          go build -p 1 -mod=readonly -buildvcs=false -o "$RUNNER_TEMP/j2-tooling/migrate" ./cmd/dur053-migrate
      - name: Measure both cgroups and profile Python on the runner
        run: |
          trial_args=()
          if [[ "$COMPARE_GOMEMLIMIT" == true ]]; then
            trial_args+=(--compare-gomemlimit)
          fi
          python3 scripts/j2_prequalify_checker.py "$POPULATION" "$RUNNER_TEMP/j2-prequalification" \
            "$RUNNER_TEMP/j2-prequalification-scratch" "$RUNNER_TEMP/j2-tooling/checker" "$RUNNER_TEMP/j2-tooling/migrate" "${trial_args[@]}"
      - name: Retain pre-qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j2-checker-prequalification-${{ matrix.population }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/j2-prequalification/
          if-no-files-found: error
          compression-level: 1

  qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification'
    uses: ./.github/workflows/j2-volume-qualification.yml
    with:
      population: 26678

  fallback:
    needs: qualification
    if: >-
      ${{ !cancelled() && needs.qualification.outputs.verdict == 'capacity_failure'
      && needs.qualification.outputs.artifact_id != ''
      }}
    uses: ./.github/workflows/j2-volume-qualification.yml
    with:
      population: 21002

  qualification-verdict:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification' }}
    needs: [qualification, fallback]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PRIMARY: ${{ needs.qualification.outputs.verdict || 'invalid' }}
      FALLBACK: ${{ needs.fallback.outputs.verdict }}
    steps:
      - run: |
          case "$PRIMARY/$FALLBACK" in
            pass/) echo "26,678 identities qualified for soak A and AB" ;;
            capacity_failure/pass) echo "21,002 identities qualified for soak A" ;;
            capacity_failure/capacity_failure)
              echo "Both volumes returned capacity_failure. See archived evidence."
              exit 1
              ;;
            *)
              echo "Qualification halted as invalid (primary=$PRIMARY, fallback=${FALLBACK:-skipped}). See archived evidence."
              exit 1
              ;;
          esac
