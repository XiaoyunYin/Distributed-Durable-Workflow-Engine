name: DUR-053 K4 offline verification

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: dur053-k4-verify
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GOMAXPROCS: '2'

jobs:
  verify:
    name: Verify committed K4 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build checker
        shell: bash
        run: go build -p 1 -buildvcs=false -o "$RUNNER_TEMP/checker" ./cmd/dur049-checker

      - name: Download and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          pattern = "experiments/portfolio/k8s-recovery/k4-v1/*/*/payload-index.json"
          paths = subprocess.check_output(["git", "ls-files", "--", pattern], text=True).splitlines()
          assert paths, "no committed K4 payload indexes"
          store = Path(os.environ["RUNNER_TEMP"]) / "store"
          for path in paths:
              index = json.loads(Path(path).read_bytes())
              tag = index["store"]["tag"]
              assert tag and Path(tag).name == tag and tag not in {".", ".."}
              destination = store / tag
              destination.mkdir(parents=True)
              subprocess.run([
                  "gh", "release", "download", tag, "-R", os.environ["GITHUB_REPOSITORY"],
                  "-D", str(destination),
              ], check=True)
              expected = {row["asset"]: row for row in index["archives"]}
              assert len(expected) == len(index["archives"]), "duplicate asset names"
              assert {p.name for p in destination.iterdir()} == set(expected), "asset set mismatch"
              for name, row in expected.items():
                  assert Path(name).name == name and name not in {".", ".."}
                  asset = destination / name
                  assert asset.is_file() and asset.stat().st_size == row["size"], name
                  with asset.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  assert digest == row["sha256"], name
              print(f"Verified {tag}: {len(expected)} assets", flush=True)
          PY

      - name: Verify evidence and retain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_SHA" > "$out/commit.txt"
          set +e
          /usr/bin/time -v python3 scripts/dur053_k4_evidence.py verify-evidence --checker "$RUNNER_TEMP/checker" --repository "$GITHUB_WORKSPACE" --store "$RUNNER_TEMP/store" > "$out/k4-verify.json" 2> "$out/k4-verify.stderr"
          status=$?
          set -e
          (cd "$out" && sha256sum commit.txt k4-verify.json k4-verify.stderr > sha256.txt)
          test "$status" -eq 0
          test -s "$out/k4-verify.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def invalid_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          path = Path(os.environ["RUNNER_TEMP"]) / "out/k4-verify.json"
          result = json.loads(path.read_bytes(), parse_constant=invalid_constant)
          assert isinstance(result, dict), "verifier output must be a JSON object"
          PY

      - name: Retain verification output including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-k4-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
