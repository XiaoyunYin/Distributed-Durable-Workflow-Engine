name: DUR-053 registered campaigns
on:
  workflow_dispatch:
    inputs:
      job:
        description: k3-pilot-1a/1b/2/3/4a/4b/5a/5b/4c1-3/5c1-3 or the exact committed carry-over name (<job>-cN)
        required: true
        default: k3-pilot-1a
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dur053-live-ledger
  cancel-in-progress: false
jobs:
  campaign:
    name: DUR-053 campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Admit and execute registered pilot job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUR053_PILOT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          python3 scripts/dur053_campaign.py --job "$DUR053_PILOT_JOB" --output "$RUNNER_TEMP/dur053-campaign" --scratch-root "$RUNNER_TEMP/dur053-campaign-scratch"
      - name: Retain complete and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-campaign-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-campaign/
          if-no-files-found: error
