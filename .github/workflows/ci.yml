name: durable-agent-engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-agent-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, Python, Terraform, and offline evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: true

      - name: Build DUR-050 generator binaries without inherited HOME
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(dirname "$(command -v go)")"
          rm -f bin/dur050-observer bin/dur050-loadgen bin/dur050-sink
          mutant="$(mktemp)"
          mutation_log="$(mktemp)"
          trap 'rm -f "$mutant" "$mutation_log"' EXIT
          sed -E '/^export (HOME|GOPATH|GOMODCACHE|GOCACHE|GOFLAGS)=/d' scripts/dur050-build-generator-binaries.sh > "$mutant"
          if sudo env -i PATH="$go_bin:/usr/bin:/bin" bash "$mutant" >"$mutation_log" 2>&1; then
            echo "The generator build survived removal of its cache environment." >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          if ! grep -Eqi 'module cache not found|GOMODCACHE nor GOPATH' "$mutation_log"; then
            echo "The export-removal mutation failed for an unexpected reason:" >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          echo "PASS: removing the explicit Go cache exports reproduces the cloud-init module-cache failure."
          cat "$mutation_log"
          rm -f "$mutant" "$mutation_log"
          sudo env -i PATH="$go_bin:/usr/bin:/bin" bash scripts/dur050-build-generator-binaries.sh
          test -x bin/dur050-observer
          test -x bin/dur050-loadgen
          test -x bin/dur050-sink

      - name: Test DUR-050 SSM wrapper through Ubuntu dash
        shell: pwsh
        run: ./scripts/test-dur050-ssm-wrapper.ps1

      - name: Test DUR-050 pilot preparation and baseline restore guards
        shell: pwsh
        run: ./scripts/test-dur050-pilot-preparation.ps1

      - name: Test DUR-050 reset stage generation and SSM orchestration
        shell: pwsh
        run: ./scripts/test-dur050-reset-stages.ps1

      - name: Lint PowerShell array concatenation precedence
        shell: pwsh
        run: ./scripts/test-dur050-powershell-ast-lint.ps1

      - name: Test DUR-050 D022 cycle preflight controls
        shell: pwsh
        run: ./scripts/test-dur050-cycle-preflight.ps1

      - name: Test DUR-050 account-only pre-apply gate
        shell: pwsh
        run: ./scripts/test-dur050-preapply-gate.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify DUR-050 evidence hashes against committed Git blobs
        shell: bash
        run: python3 scripts/test-dur050-manifest-hashes.py

      - name: Test DUR-050 post-destroy inventory controls
        shell: pwsh
        run: ./scripts/test-dur050-post-destroy-inventory.ps1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Exercise unloaded pilot runner with HOME unset
        shell: bash
        run: env -u HOME python3 scripts/test-dur050-run-unloaded-block.py

      - name: Exercise DUR-050 generator dispatch and chunked artifact retrieval
        shell: bash
        run: python3 scripts/test-dur050-generator-transfer.py

      - name: Run 1,000 single-request CPU-window trials on two CPUs
        shell: bash
        run: python3 scripts/test-dur050-loadgen-cpu-loop.py

      - name: Confirm calibration assembler accepts final-sample CPU windows
        shell: bash
        run: python3 scripts/test-dur050-assemble-calibration-cpu.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Test DUR-050 pinned apply tool and precheck mutations
        shell: pwsh
        run: ./scripts/test-dur050-apply.ps1

      - name: Enforce PowerShell 7 on every DUR-050 operator script
        shell: pwsh
        run: ./scripts/test-dur050-powershell7-requirements.ps1

      - name: Test DUR-050 task-wide ledger backfill and guard mutations
        shell: pwsh
        run: ./scripts/test-dur050-ledger-record.ps1

      - name: Test safe DUR-050 Terraform destroy wrapper
        shell: pwsh
        run: ./scripts/test-dur050-destroy.ps1

      - name: Test DUR-050 plan-state provenance with native Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/empty-config"
          printf 'terraform { required_version = "= 1.16.4" }\n' > "$temp_dir/empty-config/main.tf"
          terraform -chdir="$temp_dir/empty-config" init -backend=false -input=false
          terraform -chdir="$temp_dir/empty-config" plan -refresh=false -input=false -out="$temp_dir/empty.tfplan"
          mkdir -p "$temp_dir/lifecycle-config"
          cat > "$temp_dir/lifecycle-config/main.tf" <<'EOF'
          terraform { required_version = "= 1.16.4" }
          variable "v" {
            type    = string
            default = "a"
          }
          output "o" { value = var.v }
          EOF
          terraform -chdir="$temp_dir/lifecycle-config" init -backend=false -input=false
          terraform -chdir="$temp_dir/lifecycle-config" apply -auto-approve -input=false
          terraform -chdir="$temp_dir/lifecycle-config" plan -input=false -out="$temp_dir/lifecycle-config/p1.tfplan"
          terraform -chdir="$temp_dir/lifecycle-config" apply -auto-approve -input=false -var v=c
          terraform -chdir="$temp_dir/lifecycle-config" plan -input=false -var v=d -out="$temp_dir/lifecycle-config/p2.tfplan"
          export DUR050_NATIVE_PLAN_PATH="$temp_dir/empty.tfplan"
          export DUR050_NATIVE_STATE_PATH="$temp_dir/no-local-state.tfstate"
          export DUR050_NATIVE_LIFECYCLE_WORKDIR="$temp_dir/lifecycle-config"
          export DUR050_NATIVE_LIFECYCLE_P1_PATH="$temp_dir/lifecycle-config/p1.tfplan"
          export DUR050_NATIVE_LIFECYCLE_P2_PATH="$temp_dir/lifecycle-config/p2.tfplan"
          export DUR050_NATIVE_LIFECYCLE_STATE_PATH="$temp_dir/lifecycle-config/terraform.tfstate"
          export DUR050_TERRAFORM_EXE="$(command -v terraform)"
          pwsh -NoProfile -File scripts/test-dur050-plan-state.ps1

      - name: Validate AWS Terraform profile
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/aws fmt -check -recursive
          terraform -chdir=deploy/aws init -backend=false
          terraform -chdir=deploy/aws validate
          terraform -chdir=deploy/aws test -no-color

      - name: Validate Compose configuration
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Verify real checkout pilot admission prefix
        shell: bash
        env:
          DUR053_REQUIRE_CLEAN_TOOLING: "1"
        run: uv run pytest -q tests/test_k3b_admission.py::AdmissionTests::test_real_checkout_tooling_inventory

      - name: Check effective activity registry parity
        shell: bash
        run: uv run python scripts/check-activity-registry.py

      - name: Run Go race tests
        shell: pwsh
        run: go test -race ./...

      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz=FuzzWorkflowJSONDoesNotPanic -fuzztime=10s ./internal/api
          go test -run='^$' -fuzz=FuzzParseWorkflowGraphDoesNotPanic -fuzztime=10s ./internal/engine
          go test -run='^$' -fuzz=FuzzParseFaultTraceDoesNotPanic -fuzztime=10s ./internal/invariants
          go test -run='^$' -fuzz=FuzzReferenceModelSequences -fuzztime=10s ./internal/reference

      - name: Run govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate archived fault traces
        shell: pwsh
        run: ./scripts/m5-archive-check.ps1

  services:
    name: PostgreSQL, Kafka, and deployed smoke
    runs-on: ubuntu-24.04
    # Green runs took 35-41 min; run 42041712735 was cancelled at 45 min when the PowerShell mutation gate grew from 14 to 20 min. 75 min is about 1.8x the observed maximum.
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Run service-backed checks and race tests
        shell: pwsh
        run: ./scripts/ci.ps1 -WithServices -WithRace

      - name: Start isolated DUR-055 PostgreSQL and pgvector
        shell: pwsh
        run: docker compose --env-file .env -f deploy/local/dur055-postgres.yaml up -d --wait

      - name: Validate DUR-055 PostgreSQL FTS and pgvector retrieval
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $port = $values['DUR055_POSTGRES_PORT']
          if ([string]::IsNullOrWhiteSpace($port)) { $port = '15432' }
          $encodedUser = [uri]::EscapeDataString($values['POSTGRES_USER'])
          $encodedPassword = [uri]::EscapeDataString($values['POSTGRES_PASSWORD'])
          $encodedDatabase = [uri]::EscapeDataString($values['POSTGRES_DB'])
          $env:DUR055_TEST_DATABASE_URL = 'postgresql://{0}:{1}@127.0.0.1:{2}/{3}?sslmode=disable' -f $encodedUser, $encodedPassword, $port, $encodedDatabase
          uv run pytest -q tests/test_dur055_postgres_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'DUR-055 PostgreSQL integration checks failed.' }

      - name: Stop isolated DUR-055 PostgreSQL and pgvector
        if: always()
        shell: pwsh
        run: docker compose --env-file .env -f deploy/local/dur055-postgres.yaml down --volumes --remove-orphans

      - name: Isolate deployed relays for mutation gates
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose stop runtime-a runtime-b worker-a worker-b

      - name: Run PowerShell mutation gate
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          $mutationDatabase = 'dur046_mutation_powershell'
          $port = $values['POSTGRES_PORT']
          if ([string]::IsNullOrWhiteSpace($port)) { $port = '5432' }
          $encodedUser = [uri]::EscapeDataString($values['POSTGRES_USER'])
          $encodedPassword = [uri]::EscapeDataString($values['POSTGRES_PASSWORD'])
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $mutationDatabase WITH (FORCE)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not drop the prior DUR-046 database.' }
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "CREATE DATABASE $mutationDatabase"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the DUR-046 database.' }
          foreach ($migration in (Get-ChildItem -LiteralPath 'migrations' -Filter '*.up.sql' | Sort-Object Name)) {
            Get-Content -LiteralPath $migration.FullName -Raw |
              & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d $mutationDatabase
            if ($LASTEXITCODE -ne 0) { throw "Migration failed: $($migration.Name)" }
          }
          $mutationURL = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}?sslmode=disable" -f $encodedUser, $encodedPassword, $port, $mutationDatabase
          $env:DURABLE_MUTATION_DATABASE_URL = $mutationURL
          $parsedMutationURL = [uri]$mutationURL
          Write-Host ("DUR-046 mutation database: {0}; query: {1}" -f $parsedMutationURL.AbsolutePath.TrimStart('/'), $parsedMutationURL.Query)
          ./scripts/mutation-gate.ps1 -Output mutations/results-powershell.json

      - name: Run Linux mutation gate
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env -f deploy/local/compose.yaml)
          user_name="$(sed -n 's/^POSTGRES_USER=//p' .env)"
          password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          database="dur046_mutation_linux"
          port="$(sed -n 's/^POSTGRES_PORT=//p' .env)"
          : "${port:=5432}"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "CREATE DATABASE $database"
          for migration in migrations/*.up.sql; do
            "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d "$database" < "$migration"
          done
          encoded_user="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$user_name")"
          encoded_password="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$password")"
          export DURABLE_MUTATION_DATABASE_URL="postgresql://${encoded_user}:${encoded_password}@127.0.0.1:${port}/${database}?sslmode=disable"
          bash scripts/mutation-gate.sh

      - name: Drop isolated mutation databases
        if: always()
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          foreach ($database in @('dur046_mutation_powershell', 'dur046_mutation_linux')) {
            docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
            if ($LASTEXITCODE -ne 0) { throw "Could not drop isolated mutation database $database." }
          }

      - name: Restore deployed relays after mutation gates
        if: always()
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose up -d --wait runtime-a runtime-b worker-a worker-b

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dur046-mutation-results-${{ github.run_id }}
          path: mutations/results-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  k2-prerequisites:
    name: DUR-053 Compose prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Prove chosen workloads, witness and checker closeout
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "dur053-k2-prerequisites"
          ./scripts/dur053-kubernetes.ps1 -Context compose -Scenario prerequisites -OutputRoot $evidence
      - name: Retain prerequisite evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dur053-k2-prerequisites
          path: ${{ runner.temp }}/dur053-k2-prerequisites/
          if-no-files-found: error

  k3-package:
    name: DUR-053 package check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DUR053_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact merge-ref source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify locked registry manifests
        run: python3 scripts/dur053_lock_check.py --output "${RUNNER_TEMP}/dur053-k3-lock/lock-verification.json"
      - name: Retain registry lock evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-k3-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-k3-lock/
          if-no-files-found: error
          retention-days: 30
      - name: Run package-check
        shell: pwsh
        run: ./scripts/dur053-kubernetes.ps1 -Context kind -Scenario package-check -OutputRoot (Join-Path $env:RUNNER_TEMP "dur053-k3-package")
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-k3-package-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-k3-package/
          if-no-files-found: error
          retention-days: 30
  k3-pilot-smoke:
    name: DUR-053 pilot smoke
    # Push CI proves the immutable tested checkout, avoiding PR head/merge-tree ambiguity.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      DUR053_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact merge-ref source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise identical pilot path with engineering parameters
        shell: bash
        run: |
          set -euo pipefail
          export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          python3 scripts/dur053_campaign.py --job pilot-smoke --output "$RUNNER_TEMP/dur053-pilot-smoke" --scratch-root "$RUNNER_TEMP/dur053-pilot-smoke-scratch"
      - name: Retain engineering pilot evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-pilot-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-pilot-smoke/
          if-no-files-found: error
          retention-days: 30
  k3-smoke:
    name: DUR-053 kind smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      DUR053_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact merge-ref source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run smoke
        shell: pwsh
        run: ./scripts/dur053-kubernetes.ps1 -Context kind -Scenario smoke -OutputRoot (Join-Path $env:RUNNER_TEMP "dur053-k3-smoke")
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dur053-k3-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-k3-smoke/
          if-no-files-found: error
          retention-days: 30
