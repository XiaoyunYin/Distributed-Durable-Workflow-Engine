name: durable-agent-engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-agent-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, Python, Terraform, and offline evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - name: Build DUR-050 generator binaries without inherited HOME
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(dirname "$(command -v go)")"
          rm -f bin/dur050-observer bin/dur050-loadgen bin/dur050-sink
          mutant="$(mktemp)"
          mutation_log="$(mktemp)"
          trap 'rm -f "$mutant" "$mutation_log"' EXIT
          sed -E '/^export (HOME|GOPATH|GOMODCACHE|GOCACHE|GOFLAGS)=/d' scripts/dur050-build-generator-binaries.sh > "$mutant"
          if sudo env -i PATH="$go_bin:/usr/bin:/bin" bash "$mutant" >"$mutation_log" 2>&1; then
            echo "The generator build survived removal of its cache environment." >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          if ! grep -Eqi 'module cache not found|GOMODCACHE nor GOPATH' "$mutation_log"; then
            echo "The export-removal mutation failed for an unexpected reason:" >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          echo "PASS: removing the explicit Go cache exports reproduces the cloud-init module-cache failure."
          cat "$mutation_log"
          rm -f "$mutant" "$mutation_log"
          sudo env -i PATH="$go_bin:/usr/bin:/bin" bash scripts/dur050-build-generator-binaries.sh
          test -x bin/dur050-observer
          test -x bin/dur050-loadgen
          test -x bin/dur050-sink

      - name: Test DUR-050 SSM wrapper through Ubuntu dash
        shell: pwsh
        run: ./scripts/test-dur050-ssm-wrapper.ps1

      - name: Test DUR-050 pilot preparation and baseline restore guards
        shell: pwsh
        run: ./scripts/test-dur050-pilot-preparation.ps1

      - name: Test DUR-050 reset stage generation and SSM orchestration
        shell: pwsh
        run: ./scripts/test-dur050-reset-stages.ps1

      - name: Lint PowerShell array concatenation precedence
        shell: pwsh
        run: ./scripts/test-dur050-powershell-ast-lint.ps1

      - name: Test DUR-050 D022 cycle preflight controls
        shell: pwsh
        run: ./scripts/test-dur050-cycle-preflight.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Exercise unloaded pilot runner with HOME unset
        shell: bash
        run: env -u HOME python3 scripts/test-dur050-run-unloaded-block.py

      - name: Exercise DUR-050 generator dispatch and chunked artifact retrieval
        shell: bash
        run: python3 scripts/test-dur050-generator-transfer.py

      - name: Run 1,000 single-request CPU-window trials on two CPUs
        shell: bash
        run: python3 scripts/test-dur050-loadgen-cpu-loop.py

      - name: Confirm calibration assembler accepts final-sample CPU windows
        shell: bash
        run: python3 scripts/test-dur050-assemble-calibration-cpu.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Validate AWS Terraform profile
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/aws fmt -check -recursive
          terraform -chdir=deploy/aws init -backend=false
          terraform -chdir=deploy/aws validate
          terraform -chdir=deploy/aws test -no-color

      - name: Validate Compose configuration
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Run Go race tests
        shell: pwsh
        run: go test -race ./...

      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz=FuzzWorkflowJSONDoesNotPanic -fuzztime=10s ./internal/api
          go test -run='^$' -fuzz=FuzzParseWorkflowGraphDoesNotPanic -fuzztime=10s ./internal/engine
          go test -run='^$' -fuzz=FuzzParseFaultTraceDoesNotPanic -fuzztime=10s ./internal/invariants
          go test -run='^$' -fuzz=FuzzReferenceModelSequences -fuzztime=10s ./internal/reference

      - name: Run govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate archived fault traces
        shell: pwsh
        run: ./scripts/m5-archive-check.ps1

  services:
    name: PostgreSQL, Kafka, and deployed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Run service-backed checks and race tests
        shell: pwsh
        run: ./scripts/ci.ps1 -WithServices -WithRace

      - name: Isolate deployed relays for mutation gates
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose stop runtime-a runtime-b worker-a worker-b

      - name: Run PowerShell mutation gate
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          $mutationDatabase = 'dur046_mutation_powershell'
          $port = $values['POSTGRES_PORT']
          if ([string]::IsNullOrWhiteSpace($port)) { $port = '5432' }
          $encodedUser = [uri]::EscapeDataString($values['POSTGRES_USER'])
          $encodedPassword = [uri]::EscapeDataString($values['POSTGRES_PASSWORD'])
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $mutationDatabase WITH (FORCE)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not drop the prior DUR-046 database.' }
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "CREATE DATABASE $mutationDatabase"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the DUR-046 database.' }
          foreach ($migration in (Get-ChildItem -LiteralPath 'migrations' -Filter '*.up.sql' | Sort-Object Name)) {
            Get-Content -LiteralPath $migration.FullName -Raw |
              & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d $mutationDatabase
            if ($LASTEXITCODE -ne 0) { throw "Migration failed: $($migration.Name)" }
          }
          $mutationURL = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}?sslmode=disable" -f $encodedUser, $encodedPassword, $port, $mutationDatabase
          $env:DURABLE_MUTATION_DATABASE_URL = $mutationURL
          $parsedMutationURL = [uri]$mutationURL
          Write-Host ("DUR-046 mutation database: {0}; query: {1}" -f $parsedMutationURL.AbsolutePath.TrimStart('/'), $parsedMutationURL.Query)
          ./scripts/mutation-gate.ps1 -Output mutations/results-powershell.json

      - name: Run Linux mutation gate
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env -f deploy/local/compose.yaml)
          user_name="$(sed -n 's/^POSTGRES_USER=//p' .env)"
          password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          database="dur046_mutation_linux"
          port="$(sed -n 's/^POSTGRES_PORT=//p' .env)"
          : "${port:=5432}"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "CREATE DATABASE $database"
          for migration in migrations/*.up.sql; do
            "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d "$database" < "$migration"
          done
          encoded_user="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$user_name")"
          encoded_password="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$password")"
          export DURABLE_MUTATION_DATABASE_URL="postgresql://${encoded_user}:${encoded_password}@127.0.0.1:${port}/${database}?sslmode=disable"
          bash scripts/mutation-gate.sh

      - name: Drop isolated mutation databases
        if: always()
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          foreach ($database in @('dur046_mutation_powershell', 'dur046_mutation_linux')) {
            docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
            if ($LASTEXITCODE -ne 0) { throw "Could not drop isolated mutation database $database." }
          }

      - name: Restore deployed relays after mutation gates
        if: always()
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose up -d --wait runtime-a runtime-b worker-a worker-b

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dur046-mutation-results-${{ github.run_id }}
          path: mutations/results-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }
