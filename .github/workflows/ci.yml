        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
      - name: Exercise lifecycle engineering smoke
        shell: bash
        env:
          DUR053_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          # Driver ceiling is 4800s including verified cleanup; no ledger admission.
          bash scripts/dur053-k3.sh lifecycle-smoke "$RUNNER_TEMP/dur053-k4" "$RUNNER_TEMP/dur053-k4-scratch"
      - name: Verify engineering evidence offline
        shell: bash
        run: |
          set -euo pipefail
          go build -buildvcs=false -o "$RUNNER_TEMP/dur053-k4-checker" ./cmd/dur049-checker
          bash scripts/dur053-k3.sh verify-evidence "$RUNNER_TEMP/dur053-k4" "$RUNNER_TEMP/dur053-k4-scratch" "$RUNNER_TEMP/dur053-k4-checker"
      - name: Report registered scheduler reaction and smoke time
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "dur053-k4"
          manifest = json.loads((root / "manifest.json").read_bytes())
          confirmation = json.loads((root / "short-core-2-pair-0-treatment/confirmation.json").read_bytes())
          print(json.dumps({"elapsed_live_seconds": manifest["elapsed_live_seconds"],
                            "charged_seconds": manifest["charged_seconds"],
                            "registered_scheduler_reaction": confirmation["reaction"]}))
          PY
      - name: Retain full lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dur053-k4-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/dur053-k4/
          if-no-files-found: error
