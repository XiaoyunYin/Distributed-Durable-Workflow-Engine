name: durable-agent-engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-agent-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, Python, Terraform, and offline evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Build DUR-050 generator binaries without inherited HOME
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(dirname "$(command -v go)")"
          rm -f bin/dur050-observer bin/dur050-loadgen bin/dur050-sink
          mutant="$(mktemp)"
          mutation_log="$(mktemp)"
          trap 'rm -f "$mutant" "$mutation_log"' EXIT
          sed -E '/^export (HOME|GOPATH|GOMODCACHE|GOCACHE|GOFLAGS)=/d' scripts/dur050-build-generator-binaries.sh > "$mutant"
          if sudo env -i PATH="$go_bin:/usr/bin:/bin" bash "$mutant" >"$mutation_log" 2>&1; then
            echo "The generator build survived removal of its cache environment." >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          if ! grep -Eqi 'module cache not found|GOMODCACHE nor GOPATH' "$mutation_log"; then
            echo "The export-removal mutation failed for an unexpected reason:" >&2
            cat "$mutation_log" >&2
            exit 1
          fi
          echo "PASS: removing the explicit Go cache exports reproduces the cloud-init module-cache failure."
          cat "$mutation_log"
          rm -f "$mutant" "$mutation_log"
          sudo env -i PATH="$go_bin:/usr/bin:/bin" bash scripts/dur050-build-generator-binaries.sh
          test -x bin/dur050-observer
          test -x bin/dur050-loadgen
          test -x bin/dur050-sink

      - name: Test DUR-050 SSM wrapper through Ubuntu dash
        shell: pwsh
        run: ./scripts/test-dur050-ssm-wrapper.ps1

      - name: Test DUR-050 pilot preparation and baseline restore guards
        shell: pwsh
        run: ./scripts/test-dur050-pilot-preparation.ps1

      - name: Test DUR-050 reset stage generation and SSM orchestration
        shell: pwsh
        run: ./scripts/test-dur050-reset-stages.ps1

      - name: Lint PowerShell array concatenation precedence
        shell: pwsh
        run: ./scripts/test-dur050-powershell-ast-lint.ps1

      - name: Test DUR-050 D022 cycle preflight controls
        shell: pwsh
        run: ./scripts/test-dur050-cycle-preflight.ps1

      - name: Test DUR-050 account-only pre-apply gate
        shell: pwsh
        run: ./scripts/test-dur050-preapply-gate.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify DUR-050 evidence hashes against committed Git blobs
        shell: bash
        run: python3 scripts/test-dur050-manifest-hashes.py

      - name: Test DUR-050 post-destroy inventory controls
        shell: pwsh
        run: ./scripts/test-dur050-post-destroy-inventory.ps1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Exercise unloaded pilot runner with HOME unset
        shell: bash
        run: env -u HOME python3 scripts/test-dur050-run-unloaded-block.py

      - name: Exercise DUR-050 generator dispatch and chunked artifact retrieval
        shell: bash
        run: python3 scripts/test-dur050-generator-transfer.py

      - name: Run 1,000 single-request CPU-window trials on two CPUs
        shell: bash
        run: python3 scripts/test-dur050-loadgen-cpu-loop.py

      - name: Confirm calibration assembler accepts final-sample CPU windows
        shell: bash
        run: python3 scripts/test-dur050-assemble-calibration-cpu.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Test DUR-050 pinned apply tool and precheck mutations
        shell: pwsh
        run: ./scripts/test-dur050-apply.ps1

      - name: Enforce PowerShell 7 on every DUR-050 operator script
        shell: pwsh
        run: ./scripts/test-dur050-powershell7-requirements.ps1

      - name: Test DUR-050 task-wide ledger backfill and guard mutations
        shell: pwsh
        run: ./scripts/test-dur050-ledger-record.ps1

      - name: Test safe DUR-050 Terraform destroy wrapper
        shell: pwsh
        run: ./scripts/test-dur050-destroy.ps1

      - name: Test DUR-050 plan-state provenance with native Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/empty-config"
          printf 'terraform { required_version = "= 1.16.4" }\n' > "$temp_dir/empty-config/main.tf"
          terraform -chdir="$temp_dir/empty-config" init -backend=false -input=false
          terraform -chdir="$temp_dir/empty-config" plan -refresh=false -input=false -out="$temp_dir/empty.tfplan"
          mkdir -p "$temp_dir/lifecycle-config"
          cat > "$temp_dir/lifecycle-config/main.tf" <<'EOF'
          terraform { required_version = "= 1.16.4" }
          variable "v" {
            type    = string
            default = "a"
          }
          output "o" { value = var.v }
          EOF
          terraform -chdir="$temp_dir/lifecycle-config" init -backend=false -input=false
          terraform -chdir="$temp_dir/lifecycle-config" apply -auto-approve -input=false
          terraform -chdir="$temp_dir/lifecycle-config" plan -input=false -out="$temp_dir/lifecycle-config/p1.tfplan"
          terraform -chdir="$temp_dir/lifecycle-config" apply -auto-approve -input=false -var v=c
          terraform -chdir="$temp_dir/lifecycle-config" plan -input=false -var v=d -out="$temp_dir/lifecycle-config/p2.tfplan"
          export DUR050_NATIVE_PLAN_PATH="$temp_dir/empty.tfplan"
          export DUR050_NATIVE_STATE_PATH="$temp_dir/no-local-state.tfstate"
          export DUR050_NATIVE_LIFECYCLE_WORKDIR="$temp_dir/lifecycle-config"
          export DUR050_NATIVE_LIFECYCLE_P1_PATH="$temp_dir/lifecycle-config/p1.tfplan"
          export DUR050_NATIVE_LIFECYCLE_P2_PATH="$temp_dir/lifecycle-config/p2.tfplan"
          export DUR050_NATIVE_LIFECYCLE_STATE_PATH="$temp_dir/lifecycle-config/terraform.tfstate"
          export DUR050_TERRAFORM_EXE="$(command -v terraform)"
          pwsh -NoProfile -File scripts/test-dur050-plan-state.ps1

      - name: Validate AWS Terraform profile
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/aws fmt -check -recursive
          terraform -chdir=deploy/aws init -backend=false
          terraform -chdir=deploy/aws validate
          terraform -chdir=deploy/aws test -no-color

      - name: Validate Compose configuration
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Check frozen K4 acceptance reports offline
        shell: bash
        run: python3 scripts/dur053_k4_report.py check

      - name: Check K6 Phase A registry and admission offline
        id: k6a-smoke
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          out="$RUNNER_TEMP/k6-$GITHUB_RUN_ID-$GITHUB_JOB"
          pwsh -File scripts/dur053-kubernetes.ps1 -Context kind -Scenario faults-smoke -K6Phase A -OutputRoot "$out"
          python -m pytest -q -p no:cacheprovider tests/test_k6_registry.py tests/test_k6_admission.py

      - name: Retain K6 Phase A engineering evidence
        if: always() && steps.k6a-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: dur053-k6a-phase-a-${{ github.run_id }}
          path: ${{ runner.temp }}/k6-${{ github.run_id }}-${{ github.job }}

      - name: Measure B.6.2 checker capacity on committed short-1
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/dur049-checker" ./cmd/dur049-checker
          uv run python scripts/dur053_checker_capacity.py --checker "$RUNNER_TEMP/dur049-checker" --output "$RUNNER_TEMP/b62-capacity.json"

      - name: Retain B.6.2 checker capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b62-checker-capacity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b62-capacity.json
            ${{ runner.temp }}/b62-capacity.time.txt
          if-no-files-found: error

      - name: Verify real checkout pilot admission prefix
        shell: bash
        env:
          DUR053_REQUIRE_CLEAN_TOOLING: "1"
        run: uv run pytest -q tests/test_k3b_admission.py::AdmissionTests::test_real_checkout_tooling_inventory

      - name: Check effective activity registry parity
        shell: bash
        run: uv run python scripts/check-activity-registry.py

      - name: Run Go race tests
        shell: pwsh
        run: go test -race ./...

      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz=FuzzWorkflowJSONDoesNotPanic -fuzztime=10s ./internal/api
          go test -run='^$' -fuzz=FuzzParseWorkflowGraphDoesNotPanic -fuzztime=10s ./internal/engine
          go test -run='^$' -fuzz=FuzzParseFaultTraceDoesNotPanic -fuzztime=10s ./internal/invariants
          go test -run='^$' -fuzz=FuzzReferenceModelSequences -fuzztime=10s ./internal/reference

      - name: Run govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate archived fault traces
        shell: pwsh
        run: ./scripts/m5-archive-check.ps1

  services:
    name: PostgreSQL, Kafka, and deployed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Run service-backed checks
        shell: pwsh
        run: ./scripts/ci.ps1 -WithServices -KafkaPythonOnly

      - name: Start isolated DUR-055 PostgreSQL and pgvector
        shell: pwsh
        run: docker compose --env-file .env -f deploy/local/dur055-postgres.yaml up -d --wait

      - name: Validate DUR-055 PostgreSQL FTS and pgvector retrieval
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $port = $values['DUR055_POSTGRES_PORT']
          if ([string]::IsNullOrWhiteSpace($port)) { $port = '15432' }
          $encodedUser = [uri]::EscapeDataString($values['POSTGRES_USER'])
          $encodedPassword = [uri]::EscapeDataString($values['POSTGRES_PASSWORD'])
          $encodedDatabase = [uri]::EscapeDataString($values['POSTGRES_DB'])
          $env:DUR055_TEST_DATABASE_URL = 'postgresql://{0}:{1}@127.0.0.1:{2}/{3}?sslmode=disable' -f $encodedUser, $encodedPassword, $port, $encodedDatabase
          uv run pytest -q tests/test_dur055_postgres_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'DUR-055 PostgreSQL integration checks failed.' }

      - name: Stop isolated DUR-055 PostgreSQL and pgvector
        if: always()
        shell: pwsh
        run: docker compose --env-file .env -f deploy/local/dur055-postgres.yaml down --volumes --remove-orphans

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  services-race:
    name: PostgreSQL service-backed race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Run service-backed race and sink contract checks
        shell: pwsh
        run: ./scripts/ci.ps1 -WithServices -RaceOnly

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-race-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  services-k6:
    name: PostgreSQL K6 fixtures and parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Run tagged K6 Go tests against PostgreSQL
        shell: pwsh
        env:
          DURABLE_REQUIRE_DATABASE: '1'
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          try {
            docker compose @compose stop runtime-a runtime-b worker-a worker-b
            if ($LASTEXITCODE -ne 0) { throw 'Could not isolate runtime/worker relays.' }

            go test -p 1 -count=1 -v -tags dur053_k6 ./internal/faults ./internal/k6hook ./internal/k6ingress ./internal/state ./internal/engine ./cmd/runtime |
              Tee-Object -Variable taggedResults
            if ($LASTEXITCODE -ne 0) { throw 'Tagged K6 Go tests failed.' }
            foreach ($testName in @('TestK6LeaseTakeoverPinsIdleBackendAndFencesOriginalAttempt', 'TestK6RenewalIdleTimeoutTerminatesRealTransaction', 'TestK6SchedulerRenewalDefersFencedReleaseAfterTakeover')) {
              if (-not ($taggedResults -cmatch "^--- PASS: $testName \(")) {
                throw "Required tagged PostgreSQL test did not pass ($testName)."
              }
            }
          } finally {
            docker compose @compose up -d --wait runtime-a runtime-b worker-a worker-b
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore runtime/worker services.' }
          }

      - name: Verify legacy checker parity on PostgreSQL
        shell: bash
        env:
          DURABLE_REQUIRE_DATABASE: '1'
          GOMAXPROCS: '2'
        run: go test -p 1 -count=1 -v ./cmd/dur049-checker -run '^TestLegacyParityPostgres$'

      - name: Verify K6 G2 cuts and external evidence against two PostgreSQL instances
        shell: pwsh
        env:
          DURABLE_REQUIRE_DATABASE: '1'
          DURABLE_REQUIRE_K6_PAIR: '1'
          GOMAXPROCS: '2'
        run: |
          $settings = @{}
          foreach ($line in Get-Content -LiteralPath '.env') {
            if ($line -match '^([^#=]+)=(.*)$') { $settings[$matches[1]] = $matches[2].Trim('"') }
          }
          $user = [uri]::EscapeDataString($settings['POSTGRES_USER'])
          $pass = [uri]::EscapeDataString($settings['POSTGRES_PASSWORD'])
          $db = [uri]::EscapeDataString($settings['POSTGRES_DB'])
          $port = $settings['POSTGRES_PORT']
          if (-not $port) { $port = '5432' }
          $env:DURABLE_DATABASE_URL = "postgresql://${user}:${pass}@127.0.0.1:${port}/${db}?sslmode=disable"
          $sink = "k6g2a-sink-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sinkPassword = [guid]::NewGuid().ToString('N')
          try {
            docker run -d --name $sink -e "POSTGRES_PASSWORD=$sinkPassword" -p 127.0.0.1::5432 postgres:18.6-bookworm
            if ($LASTEXITCODE -ne 0) { throw 'Could not start the isolated sink PostgreSQL.' }
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              docker exec $sink pg_isready -q -h 127.0.0.1
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'The sink PostgreSQL did not become ready.' }
            $address = docker port $sink 5432/tcp
            if ($LASTEXITCODE -ne 0) { throw 'Could not discover the sink port.' }
            $env:DURABLE_K6_SINK_TEST_URL = "postgresql://postgres:${sinkPassword}@${address}/postgres?sslmode=disable"
            $env:DURABLE_K6_VERDICT_CHECKER = Join-Path $env:RUNNER_TEMP 'k6-verdict-checker'
            $env:DURABLE_K6_VERDICT_ARTIFACT = Join-Path $env:GITHUB_WORKSPACE 'artifacts/k6-g3a2-verdicts'
            go build -p 1 -o $env:DURABLE_K6_VERDICT_CHECKER ./cmd/dur049-checker
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the K6 verdict checker.' }
            go test -p 1 -count=1 -v ./cmd/dur049-checker ./internal/invariants/... -run '^TestK6(Cut|Source|Sink|EngineExport|Submission|Census|Column|Roster|Session|Ingress|Decision|Broker|Quiet|Topology|Orphan)'
            if ($LASTEXITCODE -ne 0) { throw 'K6 PostgreSQL fixtures failed.' }
          } finally {
            docker rm -f $sink
          }

      - name: Upload K6 G3a2 verdict evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dur053-k6-g3a2-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/k6-g3a2-verdicts/

      - name: Exercise K6 Phase C PostgreSQL startup sampling
        shell: bash
        env:
          DUR053_PHASE_C_FIXTURE_REQUIRED: '1'
          DUR053_PHASE_C_STARTUP_OUTPUT: ${{ github.workspace }}/artifacts/k6-phase-c-startup
        run: |
          set -euo pipefail
          export DUR053_PHASE_C_CONTAINER="k6c-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export POSTGRES_PASSWORD
          POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$POSTGRES_PASSWORD"
          image="$(python3 -c 'import json; print(json.load(open("deploy/k8s/tools.lock.json"))["postgres"])')"
          trap 'docker rm -f "$DUR053_PHASE_C_CONTAINER" >/dev/null' EXIT
          docker run -d --name "$DUR053_PHASE_C_CONTAINER" -p 127.0.0.1::5432 \
            -e POSTGRES_USER=durable -e POSTGRES_DB=postgres -e POSTGRES_PASSWORD \
            -e POSTGRES_HOST_AUTH_METHOD=password -e POSTGRES_INITDB_ARGS=--auth-host=password \
            "$image" -c max_connections=100
          ready=false
          for i in {1..30}; do
            if docker exec "$DUR053_PHASE_C_CONTAINER" pg_isready -q -h 127.0.0.1 -U durable -d postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Phase C PostgreSQL did not become ready."
            exit 1
          fi
          address="$(docker port "$DUR053_PHASE_C_CONTAINER" 5432/tcp)"
          export DUR053_PHASE_C_PORT="${address##*:}"
          uv run pytest -q -s tests/test_k6_phase_c_postgres.py

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-k6-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  mutation-powershell:
    name: PowerShell mutation gate (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [with-k6-a, with-k6-b, without-k6-a, without-k6-b]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Isolate deployed relays for mutation gates
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose stop runtime-a runtime-b worker-a worker-b

      - name: Select mutation cases
        shell: bash
        run: >-
          python3 scripts/mutation_shards.py select powershell ${{ matrix.shard }}
          "$RUNNER_TEMP/mutation-shard.json"

      - name: Run PowerShell mutation gate
        timeout-minutes: 75
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          $mutationDatabase = 'dur046_mutation_powershell'
          $port = $values['POSTGRES_PORT']
          if ([string]::IsNullOrWhiteSpace($port)) { $port = '5432' }
          $encodedUser = [uri]::EscapeDataString($values['POSTGRES_USER'])
          $encodedPassword = [uri]::EscapeDataString($values['POSTGRES_PASSWORD'])
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $mutationDatabase WITH (FORCE)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not drop the prior DUR-046 database.' }
          & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "CREATE DATABASE $mutationDatabase"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the DUR-046 database.' }
          foreach ($migration in (Get-ChildItem -LiteralPath 'migrations' -Filter '*.up.sql' | Sort-Object Name)) {
            Get-Content -LiteralPath $migration.FullName -Raw |
              & docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d $mutationDatabase
            if ($LASTEXITCODE -ne 0) { throw "Migration failed: $($migration.Name)" }
          }
          $mutationURL = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}?sslmode=disable" -f $encodedUser, $encodedPassword, $port, $mutationDatabase
          $env:DURABLE_MUTATION_DATABASE_URL = $mutationURL
          $parsedMutationURL = [uri]$mutationURL
          Write-Host ("DUR-046 mutation database: {0}; query: {1}" -f $parsedMutationURL.AbsolutePath.TrimStart('/'), $parsedMutationURL.Query)
          ./scripts/mutation-gate.ps1 -Output mutations/results-powershell.json -Manifest (Join-Path $env:RUNNER_TEMP "mutation-shard.json")

      - name: Drop isolated mutation databases
        if: always()
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          foreach ($database in @('dur046_mutation_powershell')) {
            docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
            if ($LASTEXITCODE -ne 0) { throw "Could not drop isolated mutation database $database." }
          }

      - name: Restore deployed relays after mutation gates
        if: always()
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose up -d --wait runtime-a runtime-b worker-a worker-b

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dur046-mutation-results-powershell-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutations/results-powershell.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-powershell-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  mutation-linux:
    name: Linux mutation gate (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [with-k6-a, with-k6-b, without-k6-a, without-k6-b]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap the isolated service stack
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -StartServices

      - name: Isolate deployed relays for mutation gates
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose stop runtime-a runtime-b worker-a worker-b

      - name: Select mutation cases
        shell: bash
        run: >-
          python3 scripts/mutation_shards.py select linux ${{ matrix.shard }}
          "$RUNNER_TEMP/mutation-shard.json"

      - name: Run Linux mutation gate
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .env -f deploy/local/compose.yaml)
          user_name="$(sed -n 's/^POSTGRES_USER=//p' .env)"
          password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          database="dur046_mutation_linux"
          port="$(sed -n 's/^POSTGRES_PORT=//p' .env)"
          : "${port:=5432}"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d postgres -c "CREATE DATABASE $database"
          for migration in migrations/*.up.sql; do
            "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$user_name" -d "$database" < "$migration"
          done
          encoded_user="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$user_name")"
          encoded_password="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$password")"
          export DURABLE_MUTATION_DATABASE_URL="postgresql://${encoded_user}:${encoded_password}@127.0.0.1:${port}/${database}?sslmode=disable"
          bash scripts/mutation-gate.sh mutations/results-bash.json "$RUNNER_TEMP/mutation-shard.json"

      - name: Drop isolated mutation databases
        if: always()
        shell: pwsh
        run: |
          $values = @{}
          foreach ($line in (Get-Content -LiteralPath '.env')) {
            if ($line -match '^([^#=]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          foreach ($database in @('dur046_mutation_linux')) {
            docker compose @compose exec -T postgres psql -v ON_ERROR_STOP=1 -U $values['POSTGRES_USER'] -d postgres -c "DROP DATABASE IF EXISTS $database WITH (FORCE)"
            if ($LASTEXITCODE -ne 0) { throw "Could not drop isolated mutation database $database." }
          }

      - name: Restore deployed relays after mutation gates
        if: always()
        shell: pwsh
        run: |
          $compose = @('--env-file', '.env', '-f', 'deploy/local/compose.yaml')
          docker compose @compose up -d --wait runtime-a runtime-b worker-a worker-b

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dur046-mutation-results-linux-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutations/results-bash.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect service diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml ps > artifacts/compose-ps.txt
            docker compose --env-file .env -f deploy/local/compose.yaml logs --no-color > artifacts/compose-logs.txt
          }

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-linux-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the isolated service stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .env) {
            docker compose --env-file .env -f deploy/local/compose.yaml down --volumes --remove-orphans
          }

  mutation-coverage:
    name: Mutation gate coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [mutation-linux, mutation-powershell]
    if: always()
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download mutation shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: dur046-mutation-results-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-reports

      - name: Verify both complete mutation gates
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.mutation-linux.result }}
          POWERSHELL_RESULT: ${{ needs.mutation-powershell.result }}
        run: |
          set -euo pipefail
          test "$LINUX_RESULT" = success
          test "$POWERSHELL_RESULT" = success
          python3 scripts/mutation_shards.py verify "$RUNNER_TEMP/mutation-reports" \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$(git rev-parse HEAD)"

