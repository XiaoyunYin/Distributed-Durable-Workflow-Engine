# Opt-in K2c fixture/witness settings. Default compose.yaml is unchanged.
services:
  runtime-a:
    environment:
      RUNTIME_NAMESPACE: ${DUR053_NAMESPACE:?campaign namespace required}
      DUR048_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR053_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR049_RECORD_LEASE_ACQUISITIONS: "1"
  runtime-b:
    environment:
      RUNTIME_NAMESPACE: ${DUR053_NAMESPACE:?campaign namespace required}
      DUR048_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR053_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR049_RECORD_LEASE_ACQUISITIONS: "1"
  worker-a:
    environment:
      DUR053_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR053_CPU_WORK_UNITS: ${DUR053_CPU_WORK_UNITS:-10000}
      DUR053_WITNESS_DIR: /witness
      POD_NAME: worker-a
      POD_UID: ${DUR053_NAMESPACE}-worker-a
      WORKER_DRAIN_SECONDS: "30"
    volumes:
      - ${DUR053_WITNESS_HOST:?host witness path required}/worker-a:/witness
  worker-b:
    environment:
      DUR053_ALLOW_FIXTURE_ACTIVITY: "1"
      DUR053_CPU_WORK_UNITS: ${DUR053_CPU_WORK_UNITS:-10000}
      DUR053_WITNESS_DIR: /witness
      POD_NAME: worker-b
      POD_UID: ${DUR053_NAMESPACE}-worker-b
      WORKER_DRAIN_SECONDS: "30"
    volumes:
      - ${DUR053_WITNESS_HOST:?host witness path required}/worker-b:/witness
