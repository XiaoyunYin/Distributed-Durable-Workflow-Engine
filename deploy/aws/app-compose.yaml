name: durable-aws-app

services:
  runtime:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.runtime
      target: dur049-campaign
    environment:
      RUNTIME_ADDR: 0.0.0.0:8080
      RUNTIME_ROLE: ${RUNTIME_ROLE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      RUNTIME_SCHEDULER: "enabled"
      RUNTIME_NAMESPACE: dur049-aws
      # Bounded campaign evidence only. Normal/local runtime stores leave the
      # append-only lease-acquisition ledger disabled by default.
      DUR049_RECORD_LEASE_ACQUISITIONS: "1"
      DUR049_OWNER_LOCK_ISOLATION_WORKFLOW_ID: ${DUR049_OWNER_LOCK_ISOLATION_WORKFLOW_ID:-}
      DUR049_OWNER_LOCK_ISOLATION_HOLD_MS: ${DUR049_OWNER_LOCK_ISOLATION_HOLD_MS:-0}
      RUNTIME_ENGINE_MODE: disabled
      DUR048_ACTIVITY_DELAY_MS: ${DUR048_ACTIVITY_DELAY_MS:-0}
      DUR048_ALLOW_FIXTURE_ACTIVITY: ${DUR048_ALLOW_FIXTURE_ACTIVITY:-0}
      RUNTIME_SCHEDULER_HOLD_AFTER_ACQUIRE_MS: ${RUNTIME_SCHEDULER_HOLD_AFTER_ACQUIRE_MS:-0}
    entrypoint: ${RUNTIME_ENTRYPOINT:-/runtime}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/runtime", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.worker
    environment:
      WORKER_ADDR: 0.0.0.0:8081
      WORKER_ID: ${WORKER_ID}
      WORKER_SLOTS: ${WORKER_SLOTS}
      DUR048_ACTIVITY_DELAY_MS: ${DUR048_ACTIVITY_DELAY_MS:-0}
      CONTROL_API_URL: http://runtime:8080
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "workers", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
