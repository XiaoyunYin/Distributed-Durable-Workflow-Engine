    {
      "apiVersion": "keda.sh/v1alpha1",
      "kind": "ScaledObject",
      "metadata": {
        "name": "worker-demand"
      },
      "spec": {
        "scaleTargetRef": {
          "name": "worker"
        },
        "pollingInterval": 5,
        "cooldownPeriod": 60,
        "minReplicaCount": 1,
        "maxReplicaCount": 4,
        "fallback": {
          "failureThreshold": 3,
          "replicas": 2
        },
        "advanced": {
          "horizontalPodAutoscalerConfig": {
            "behavior": {
              "scaleUp": {
                "stabilizationWindowSeconds": 0,
                "policies": [
                  {
                    "type": "Pods",
                    "value": 1,
                    "periodSeconds": 30
                  }
                ],
                "selectPolicy": "Min"
              },
              "scaleDown": {
                "stabilizationWindowSeconds": 60,
                "policies": [
                  {
                    "type": "Pods",
                    "value": 1,
                    "periodSeconds": 30
                  }
                ],
                "selectPolicy": "Min"
              }
            }
          }
        },
        "triggers": [
          {
            "type": "metrics-api",
            "metricType": "AverageValue",
            "metadata": {
              "url": "http://demand.dur053-kind.svc.cluster.local:8091/v1/demand",
              "format": "json",
              "valueLocation": "demand",
              "targetValue": "2",
              "authMode": "bearer",
              "unsafeSsl": "false"
            },
            "authenticationRef": {
              "name": "campaign-demand"
            }
          }
        ]
      }
    }
  ]
}
